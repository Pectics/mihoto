name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Setup cache
        uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1

      - name: Check cargo fmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo check
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets

      - name: Run tests without self-update
        run: cargo test --all-targets --no-default-features

      - name: Check installer
        run: |
          sh -n install.sh
          scripts/test-installer-contract.sh
          sh -n scripts/test-systemd-integration.sh
          sh -n scripts/test-tun-integration.sh

      - name: Check system scope
        run: scripts/check-system-scope.sh

      - name: Check release workflow contract
        run: scripts/check-release-workflow.sh
