name: Real host acceptance

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Existing commit or tag to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  x86_64:
    name: Validate systemd and TUN on x86_64
    runs-on: [self-hosted, linux, systemd, tun, x64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.ref }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88.0
      - run: cargo build --locked --release
      - name: Exercise real systemd lifecycle
        run: sudo env MIHOTO_SYSTEMD_INTEGRATION=1 MIHOTO_ALLOW_SYSTEMD_MUTATION=1 MIHOTO_REAL_MIHOMO=/usr/local/libexec/mihoto-test/mihomo scripts/test-systemd-integration.sh
      - name: Exercise real TUN routing and cleanup
        run: sudo env MIHOTO_TUN_INTEGRATION=1 MIHOTO_ALLOW_SYSTEMD_MUTATION=1 MIHOTO_REAL_MIHOMO=/usr/local/libexec/mihoto-test/mihomo scripts/test-tun-integration.sh

  aarch64:
    name: Validate systemd and TUN on aarch64
    runs-on: [self-hosted, linux, systemd, tun, arm64]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.ref }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.88.0
      - run: cargo build --locked --release
      - name: Exercise real systemd lifecycle
        run: sudo env MIHOTO_SYSTEMD_INTEGRATION=1 MIHOTO_ALLOW_SYSTEMD_MUTATION=1 MIHOTO_REAL_MIHOMO=/usr/local/libexec/mihoto-test/mihomo scripts/test-systemd-integration.sh
      - name: Exercise real TUN routing and cleanup
        run: sudo env MIHOTO_TUN_INTEGRATION=1 MIHOTO_ALLOW_SYSTEMD_MUTATION=1 MIHOTO_REAL_MIHOMO=/usr/local/libexec/mihoto-test/mihomo scripts/test-tun-integration.sh
